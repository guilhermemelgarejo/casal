name: Deploy to Hostinger (Fast Zip)

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

concurrency:
  group: duozen-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Fast Deploy
    runs-on: ubuntu-24.04

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v6

      - name: Validate FTPS endpoint preparation
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Verify Hostinger endpoint with strict TLS
        id: ftps
        timeout-minutes: 1
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          # Optional Hostinger certificate hostname; IP connections default to hstgr.io.
          FTP_HOSTNAME: ${{ vars.FTP_HOSTNAME }}
        run: python3 .github/scripts/resolve_ftps_host.py

      - name: Pin FTPS hostname to the configured server IP
        env:
          FTPS_HOSTNAME: ${{ steps.ftps.outputs.hostname }}
          FTPS_ADDRESS: ${{ steps.ftps.outputs.address }}
        run: |
          # Only this temporary runner changes. Preserve the exact configured
          # FTP IP while the deployment action verifies the certificate name.
          if [ -n "$FTPS_ADDRESS" ]; then
            printf '%s\t%s\n' "$FTPS_ADDRESS" "$FTPS_HOSTNAME" | sudo tee -a /etc/hosts >/dev/null
          fi

      - name: 🐘 Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql, pdo_sqlite, bcmath, curl, fileinfo, zip
          coverage: none
          tools: composer:v2

      - name: Locate Composer download cache
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php84-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-php84-composer-

      - name: Validate dependencies and run tests
        env:
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: |
          composer validate --strict
          composer install --no-interaction --prefer-dist --no-progress
          composer audit --locked --no-interaction
          php vendor/phpunit/phpunit/phpunit --no-progress

      - name: 📦 Install Composer Dependencies (Production)
        run: |
          composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist --no-progress

      - name: 📦 Package Application into release.zip
        run: |
          # 1. Criar diretórios de montagem
          mkdir -p .deploy_staging
          mkdir -p .deploy_upload

          # 2. Copiar arquivos necessários do Laravel
          cp -r app bootstrap config public resources routes storage vendor .deploy_staging/
          cp artisan composer.json composer.lock .htaccess .deploy_staging/

          # Never publish local caches, sessions, logs, credentials or backup data.
          find .deploy_staging/bootstrap/cache -type f ! -name .gitignore -delete
          find .deploy_staging/storage -type f ! -name .gitignore -delete

          # 3. Garantir pastas de cache do framework
          mkdir -p .deploy_staging/storage/framework/cache/data
          mkdir -p .deploy_staging/storage/framework/sessions
          mkdir -p .deploy_staging/storage/framework/views
          mkdir -p .deploy_staging/storage/logs

          # 4. Gerar o pacote release.zip
          cd .deploy_staging
          zip -r -q ../.deploy_upload/release.zip .
          cd ..

          # 5. Adicionar o extrator standalone para envio
          cp deploy_extractor.php .deploy_upload/

      - name: Install FTPS client
        timeout-minutes: 2
        run: |
          if ! command -v lftp >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends lftp
          fi

      - name: Upload release with verified FTPS and per-file resume
        id: upload
        timeout-minutes: 9
        env:
          FTPS_HOSTNAME: ${{ steps.ftps.outputs.hostname }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 -B .github/scripts/upload_release.py

      - name: ⚡ Trigger Auto-Extraction (No Database Changes)
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          RELEASE_SHA256: ${{ steps.upload.outputs.release_sha256 }}
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          set -euo pipefail
          if [ -n "$DEPLOY_TOKEN" ] && [ -n "$APP_URL" ]; then
            echo "Disparando extração e pós-deploy..."
            BASE_URL="${APP_URL%/}"
            RESPONSE_FILE=$(mktemp)
            trap 'rm -f "$RESPONSE_FILE"' EXIT
            CURL_STATUS=0
            HTTP_STATUS=$(curl --silent --show-error --connect-timeout 15 --max-time 180 \
              --output "$RESPONSE_FILE" --write-out '%{http_code}' \
              --request POST --header "X-Deploy-Token: $DEPLOY_TOKEN" \
              --header "X-Release-SHA256: $RELEASE_SHA256" \
              "$BASE_URL/deploy_extractor.php") || CURL_STATUS=$?
            echo "Resposta do extrator: HTTP $HTTP_STATUS"
            # Never dump an HTML debug page or arbitrary server response into public CI logs.
            if jq -e 'type == "object"' "$RESPONSE_FILE" >/dev/null 2>&1; then
              jq '{status, message, duration_seconds, logs}' "$RESPONSE_FILE"
            else
              echo "Resposta não JSON. Consulte o log PHP da hospedagem."
            fi
            if [ "$CURL_STATUS" -ne 0 ]; then exit "$CURL_STATUS"; fi
            if [ "$HTTP_STATUS" != "200" ]; then exit 1; fi
            jq -e '.status == "success"' "$RESPONSE_FILE" >/dev/null
          else
            echo "Aviso: DEPLOY_TOKEN ou APP_URL não definidos nos Secrets do GitHub."
            exit 1
          fi
