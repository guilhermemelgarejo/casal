name: Deploy to Hostinger (Fast Zip)

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

concurrency:
  group: duozen-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Fast Deploy
    runs-on: ubuntu-24.04

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v6

      - name: Validate FTPS hostname resolution
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Resolve Hostinger hostname for strict TLS
        id: ftps
        timeout-minutes: 1
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          # Optional override if the provider has no reverse DNS record.
          FTP_HOSTNAME: ${{ vars.FTP_HOSTNAME }}
        run: python3 .github/scripts/resolve_ftps_host.py

      - name: 🐘 Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql, pdo_sqlite, bcmath, curl, fileinfo, zip
          coverage: none
          tools: composer:v2

      - name: Validate dependencies and run tests
        env:
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: |
          composer validate --strict
          composer install --no-interaction --prefer-dist --no-progress
          composer audit --locked --no-interaction
          php vendor/phpunit/phpunit/phpunit --no-progress

      - name: 📦 Install Composer Dependencies (Production)
        run: |
          composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist --no-progress

      - name: 📦 Package Application into release.zip
        run: |
          # 1. Criar diretórios de montagem
          mkdir -p .deploy_staging
          mkdir -p .deploy_upload

          # 2. Copiar arquivos necessários do Laravel
          cp -r app bootstrap config public resources routes storage vendor .deploy_staging/
          cp artisan composer.json composer.lock .htaccess .deploy_staging/

          # Never publish local caches, sessions, logs, credentials or backup data.
          find .deploy_staging/bootstrap/cache -type f ! -name .gitignore -delete
          find .deploy_staging/storage -type f ! -name .gitignore -delete

          # 3. Garantir pastas de cache do framework
          mkdir -p .deploy_staging/storage/framework/cache/data
          mkdir -p .deploy_staging/storage/framework/sessions
          mkdir -p .deploy_staging/storage/framework/views
          mkdir -p .deploy_staging/storage/logs

          # 4. Gerar o pacote release.zip
          cd .deploy_staging
          zip -r -q ../.deploy_upload/release.zip .
          cd ..

          # 5. Adicionar o extrator standalone para envio
          cp deploy_extractor.php .deploy_upload/

      - name: 🚀 Fast FTP Upload (Zip Only) - Tentativa 1
        id: ftp1
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        continue-on-error: true
        with:
          server: ${{ steps.ftps.outputs.hostname }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: domains/duozen.com.br/public_html/
          local-dir: .deploy_upload/
          dangerous-clean-slate: false
          port: 21
          timeout: 300000
          security: strict
          protocol: ftps

      - name: ⏳ Pausa antes de tentar novamente
        if: steps.ftp1.outcome == 'failure'
        run: sleep 5

      - name: 🔄 Fast FTP Upload (Zip Only) - Tentativa 2
        id: ftp2
        if: steps.ftp1.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        continue-on-error: true
        with:
          server: ${{ steps.ftps.outputs.hostname }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: domains/duozen.com.br/public_html/
          local-dir: .deploy_upload/
          dangerous-clean-slate: false
          port: 21
          timeout: 300000
          security: strict
          protocol: ftps

      - name: ⏳ Pausa antes da tentativa final
        if: steps.ftp1.outcome == 'failure' && steps.ftp2.outcome == 'failure'
        run: sleep 10

      - name: 🔄 Fast FTP Upload (Zip Only) - Tentativa 3 (Final)
        id: ftp3
        if: steps.ftp1.outcome == 'failure' && steps.ftp2.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ steps.ftps.outputs.hostname }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: domains/duozen.com.br/public_html/
          local-dir: .deploy_upload/
          dangerous-clean-slate: false
          port: 21
          timeout: 300000
          security: strict
          protocol: ftps

      - name: ⚡ Trigger Auto-Extraction (No Database Changes)
        if: steps.ftp1.outcome == 'success' || steps.ftp2.outcome == 'success' || steps.ftp3.outcome == 'success'
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          set -euo pipefail
          if [ -n "$DEPLOY_TOKEN" ] && [ -n "$APP_URL" ]; then
            echo "Disparando extração e pós-deploy..."
            BASE_URL="${APP_URL%/}"
            RESPONSE=$(curl --fail-with-body --silent --show-error --max-time 180 \
              --request POST --header "X-Deploy-Token: $DEPLOY_TOKEN" \
              "$BASE_URL/deploy_extractor.php")
            echo "Resultado do servidor:"
            echo "$RESPONSE"
            echo "$RESPONSE" | jq -e '.status == "success"' >/dev/null
          else
            echo "Aviso: DEPLOY_TOKEN ou APP_URL não definidos nos Secrets do GitHub."
            exit 1
          fi
