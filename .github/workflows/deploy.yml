name: Deploy to Hostinger

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy via FTP
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐘 Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql, bcmath, curl, fileinfo
          coverage: none
          tools: composer:v2

      - name: 📦 Install Composer Dependencies (Production)
        run: |
          composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist --no-progress

      - name: 🏗️ Prepare Deploy Structure (casal_core + public_html)
        run: |
          # Criar diretórios de staging para o deploy
          mkdir -p .deploy_payload/casal_core
          mkdir -p .deploy_payload/public_html

          # 1. Copiar arquivos do núcleo para casal_core
          cp -r app .deploy_payload/casal_core/
          cp -r bootstrap .deploy_payload/casal_core/
          cp -r config .deploy_payload/casal_core/
          cp -r database .deploy_payload/casal_core/
          cp -r resources .deploy_payload/casal_core/
          cp -r routes .deploy_payload/casal_core/
          cp -r storage .deploy_payload/casal_core/
          cp -r vendor .deploy_payload/casal_core/
          cp artisan .deploy_payload/casal_core/
          cp composer.json .deploy_payload/casal_core/
          cp composer.lock .deploy_payload/casal_core/

          # Garantir que pastas de cache existam com estrutura limpa
          mkdir -p .deploy_payload/casal_core/storage/framework/cache/data
          mkdir -p .deploy_payload/casal_core/storage/framework/sessions
          mkdir -p .deploy_payload/casal_core/storage/framework/views
          mkdir -p .deploy_payload/casal_core/storage/logs
          mkdir -p .deploy_payload/casal_core/bootstrap/cache

          # 2. Copiar conteúdo público para public_html
          cp -r public/* .deploy_payload/public_html/

          # 3. Sobrescrever public_html/index.php com os caminhos apontando para casal_core
          cat << 'EOF' > .deploy_payload/public_html/index.php
          <?php

          use Illuminate\Foundation\Application;
          use Illuminate\Http\Request;

          define('LARAVEL_START', microtime(true));

          // Modo de manutenção
          if (file_exists($maintenance = __DIR__.'/../casal_core/storage/framework/maintenance.php')) {
              require $maintenance;
          }

          // Autoload do Composer
          require __DIR__.'/../casal_core/vendor/autoload.php';

          // Inicialização do Laravel
          /** @var Application $app */
          $app = require_once __DIR__.'/../casal_core/bootstrap/app.php';

          $app->handleRequest(Request::capture());
          EOF

      - name: 🚀 Sync Files via FTP to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR || './' }}
          local-dir: .deploy_payload/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/tests/**
            **/.env
            **/casal_core/storage/logs/**
            **/casal_core/storage/framework/cache/data/**
            **/casal_core/storage/framework/sessions/**
            **/casal_core/storage/framework/views/**

      - name: ⚡ Run Post-Deploy Hook (Migrate & Optimize)
        run: |
          if [ -n "${{ secrets.DEPLOY_TOKEN }}" ] && [ -n "${{ secrets.APP_URL }}" ]; then
            echo "Disparando Webhook de Pós-Deploy..."
            curl -s -S -X POST \
              -H "X-Deploy-Token: ${{ secrets.DEPLOY_TOKEN }}" \
              "${{ secrets.APP_URL }}/system/deploy-hook" || echo "Aviso: Webhook pós-deploy retornou código diferente de sucesso."
          else
            echo "Aviso: DEPLOY_TOKEN ou APP_URL não definidos nos Secrets do GitHub."
          fi
